schema_version: 1

context:
  name: pyiron_snippets
  version: "1.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_snippets-${{ version }}.tar.gz
  sha256: e7eb9d0495d58a422ca11c0a69fc4d25d3976dc598c47d1b3ecc4bb170efa14c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.28.0
    - hatch-vcs ==0.5.0
  run:
    - python >=${{ python_min }},<3.15

tests:
  - python:
      imports:
        - pyiron_snippets
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: pyiron_snippets - Short, dependency-free python snippets.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_snippets

extra:
  recipe-maintainers:
    - liamhuber
    - samwaseda
    - jan-janssen
    - niklassiemer
    - pyiron-runner
